name: DISCOVERLY Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Flutter plugin build can resolve Maven dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          flutter = Path(shutil.which("flutter")).resolve()
          sdk_root = flutter.parent.parent
          settings = sdk_root / "packages/flutter_tools/gradle/settings.gradle.kts"
          current = settings.read_text()
          if "pluginManagement" not in current:
              header = (
                  "pluginManagement {\n"
                  "    repositories {\n"
                  "        google()\n"
                  "        mavenCentral()\n"
                  "        gradlePluginPortal()\n"
                  "    }\n"
                  "}\n\n"
              )
              settings.write_text(header + current)
          print(f"Verified plugin repositories in {settings}")
          PY
      - name: Generate Android platform files
        run: flutter create --platforms=android --org=com.discoverly .
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
              p.write_text(s)
          print('INTERNET permission verified in', p)
          PY
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Generate premium app icon assets
        run: |
          python3 -m pip install --quiet pillow
          python3 tooling/generate_icon.py
      - name: Bundle Inter font (offline at runtime)
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o assets/fonts/Inter.ttf
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt' -o assets/fonts/Inter-OFL.txt
          test -s assets/fonts/Inter.ttf
      - name: Install packages
        run: flutter pub get
      - name: Apply Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build release APK for device QA
        run: flutter build apk --release
      - name: Build release Android App Bundle for Play testing
        run: flutter build appbundle --release
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discoverly-android-builds
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

