name: DISCOVERLY Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Precache Flutter Android engine artifacts
        run: flutter precache --android
      - name: Generate Android platform files
        run: flutter create --platforms=android --org=com.discoverly .
      - name: Prepare Android release configuration
        run: python3 tooling/prepare_android.py
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
              p.write_text(s)
          print('INTERNET permission verified in', p)
          PY
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Generate premium app icon assets
        run: |
          python3 -m pip install --quiet pillow
          python3 tooling/generate_icon.py
      - name: Bundle Inter font (offline at runtime)
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o assets/fonts/Inter.ttf
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt' -o assets/fonts/Inter-OFL.txt
          test -s assets/fonts/Inter.ttf
      - name: Install packages
        run: flutter pub get
      - name: Apply Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Configure Play upload signing (GitHub Secrets)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.DISCOVERLY_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.DISCOVERLY_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.DISCOVERLY_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.DISCOVERLY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$UPLOAD_KEYSTORE_PASSWORD" ] && [ -n "$UPLOAD_KEY_ALIAS" ] && [ -n "$UPLOAD_KEY_PASSWORD" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            test -s android/app/upload-keystore.jks
            keytool -list -keystore android/app/upload-keystore.jks -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" >/dev/null
            echo "Upload keystore file and alias verified."
            cat > android/key.properties <<EOF
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "HAS_UPLOAD_KEY=true" >> "$GITHUB_ENV"
            echo "Play upload signing configured."
          else
            echo "HAS_UPLOAD_KEY=false" >> "$GITHUB_ENV"
            echo "::warning::Upload signing secrets are not configured. APK will be built for device QA; Play AAB will be skipped."
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build release APK for device QA
        run: flutter build apk --release
      - name: Build signed Android App Bundle for Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        run: flutter build appbundle --release
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discoverly-android-builds
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: warn
