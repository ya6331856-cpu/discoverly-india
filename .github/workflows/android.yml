name: DISCOVERLY Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org=com.discoverly .
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
              p.write_text(s)
          print('INTERNET permission verified in', p)
          PY
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Generate premium app icon assets
        run: |
          python3 -m pip install --quiet pillow
          python3 tooling/generate_icon.py
      - name: Install packages
        run: flutter pub get
      - name: Apply Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discoverly-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
