name: discoverly
description: DISCOVERLY India business discovery Android app.
publish_to: none
version: 0.3.0+3
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  supabase_flutter: ^2.15.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 100

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/discoverly_launcher.png
  adaptive_icon_background: "#071F19"
  adaptive_icon_foreground: assets/discoverly_foreground.png
  min_sdk_android: 21
